<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="386" viewBox="0 0 1220 386" role="img" aria-labelledby="title desc">
  <title id="title">Input item composer reference</title>
  <desc id="desc">Action Tab becomes a removable attachment chip inside the input box. Prefix attachment chips appear before the only editable text item.</desc>
  <rect width="1220" height="386" fill="#ffffff"/>
  <text x="7" y="39" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="400">
    Focus: action Tab turns into a removable attachment chip inside the input box;
  </text>
  <text x="7" y="82" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="400">
    only one text item remains editable.
  </text>

  <rect x="7" y="127" width="1190" height="240" rx="26" fill="#171614"/>
  <text x="44" y="187" fill="#aba29c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="650">
    Recommended: prefix attachments + one editable text item
  </text>

  <rect x="43" y="212" width="1119" height="118" rx="42" fill="#221f1c" stroke="#514c47" stroke-width="2"/>

  <rect x="69" y="254" width="214" height="51" rx="25.5" fill="#3a2922" stroke="#a26349" stroke-width="2"/>
  <text x="89" y="289" fill="#ffd7c4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="650">
    Skill · Review
  </text>
  <text x="250" y="289" fill="#f7eee8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="600">×</text>

  <rect x="301" y="254" width="211" height="51" rx="25.5" fill="#2c2926" stroke="#5a5550" stroke-width="2"/>
  <text x="320" y="289" fill="#ded6cf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="650">
    Image region
  </text>
  <text x="480" y="289" fill="#f7eee8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="600">×</text>

  <text x="531" y="289" fill="#f7eee8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="650">
    继续说明这个改动的边界
  </text>

  <rect x="1067" y="238" width="69" height="69" rx="24" fill="#f66f4e"/>
  <text x="1092" y="287" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="35" font-weight="600">↑</text>
</svg>
